buffers { size_kb: 65536 fill_policy: RING_BUFFER }
duration_ms: 45000
data_sources { config { name: "android.surfaceflinger.frametimeline" } }
data_sources { config { name: "linux.process_stats" process_stats_config { scan_all_processes_on_start: true } } }
data_sources { config { name: "linux.sys_stats" sys_stats_config { stat_period_ms: 500 stat_counters: STAT_CPU_TIMES } } }
data_sources { config { name: "linux.ftrace" ftrace_config { ftrace_events: "ftrace/print" ftrace_events: "sched/sched_switch" atrace_categories: "am" atrace_categories: "input" atrace_categories: "dalvik" atrace_apps: "*" } } }
